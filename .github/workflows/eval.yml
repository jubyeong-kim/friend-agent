# 도구 선택 평가 게이트. 진짜 모델을 46번 부르므로(비용 발생) 두 경우에만 돈다.
#   - PR 에 eval 라벨을 붙였을 때(붙이는 그 순간 한 번. 다시 돌리려면 라벨을 뗐다가 다시 붙인다)
#   - Actions 의 Run workflow 버튼(이 파일이 기본 가지 main 에 있어야 버튼이 보인다)
# 도구와 인자 모두 정답이 MIN_PASS 개보다 적으면 실패로 끝난다. 기준 40 은 지금 수준(42 · 42 · 42 · 41)에서 흔들림 2개를 뺀 값.
# pull_request_target 은 쓰지 않는다. 바깥 저장소에서 온 PR 은 시크릿을 받지 못해 키 없음으로 멈춘다.
name: eval

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tool-selection:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'eval'
    runs-on: ubuntu-latest
    env:
      MIN_PASS: "40"
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python scripts/eval_tools.py --min "$MIN_PASS"
