# Actions 안에서 Dockerfile로 이미지를 만들고, 커밋 번호를 태그로 붙여 Artifact Registry에 올린 뒤 그 이미지로 배포한다.
# 사용법: deploy-envs.yml 의 deploy 작업을 이 파일의 내용으로 바꾼다(테스트, 환경, 승인 구조는 그대로).
#   저장소 공통 Variables 에 AR_REPO(예: us-central1-docker.pkg.dev/<프로젝트 ID>/friend-agent) 를 추가한다.
#   배포용 서비스 계정에 Artifact Registry 저장소 하나에 대한 쓰기 권한(roles/artifactregistry.writer)을 추가한다(docs/wif-setup.md 5단계).
# 배포용 이미지는 여기서만 만든다. 노트북에서 만든 이미지는 CPU 종류가 다를 수 있고, 누가 언제 만들었는지 기록이 남지 않는다.
name: deploy

on:
  push:
    branches: [staging, main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    env:
      IMAGE: ${{ vars.AR_REPO }}/friend-agent:${{ github.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: 이미지 만들기와 올리기 (staging)
        if: github.ref_name == 'staging'
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker build --tag "$IMAGE" .
          docker push "$IMAGE"
          echo "DEPLOY_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "DEPLOY_COMMIT=${{ github.sha }}" >> "$GITHUB_ENV"

      # main 에서는 이미지를 다시 만들지 않고, staging 에서 트래픽을 가장 많이 받는 리비전의 이미지를 다이제스트로 가져간다.
      - name: staging 이미지 찾기 (production 승격)
        if: github.ref_name == 'main'
        run: |
          REVISION=$(gcloud run services describe friend-agent-staging --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          REV_JSON=$(gcloud run revisions describe "$REVISION" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json)
          DIGEST=$(echo "$REV_JSON" | jq -r '.status.imageDigest')
          COMMIT=$(echo "$REV_JSON" | jq -r '.spec.containers[0].env[] | select(.name == "COMMIT_SHA") | .value')
          case "$DIGEST" in *@sha256:*) ;; *) echo "다이제스트가 아니다: $DIGEST"; exit 1 ;; esac
          [ -n "$COMMIT" ] || { echo "staging 에 COMMIT_SHA 가 없다"; exit 1; }
          echo "승격할 staging 리비전 $REVISION"
          echo "다이제스트 $DIGEST"
          echo "커밋 $COMMIT"
          echo "DEPLOY_IMAGE=$DIGEST" >> "$GITHUB_ENV"
          echo "DEPLOY_COMMIT=$COMMIT" >> "$GITHUB_ENV"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.SERVICE }}
          region: us-central1
          project_id: ${{ vars.GCP_PROJECT_ID }}
          image: ${{ env.DEPLOY_IMAGE }}
          env_vars: |
            COMMIT_SHA=${{ env.DEPLOY_COMMIT }}
            ENV=${{ vars.ENV }}
          flags: --service-account=${{ vars.RUNTIME_SA }} --startup-probe=httpGet.path=/health,periodSeconds=5,failureThreshold=12,timeoutSeconds=2
          # 블루그린: 새 리비전은 트래픽 0%로 올리고 green 태그를 붙인다. tag 를 주면 url 출력은 서비스 주소가 아니라 태그 주소다.
          no_traffic: true
          tag: green

      - name: 배포 결과
        run: |
          echo "새 리비전 태그 주소 ${{ steps.deploy.outputs.url }}"
          echo "배포한 이미지 $DEPLOY_IMAGE"

      # 전환 전에 태그 주소로 새 리비전만 확인한다. 끝까지 통과하지 못하면 이 단계가 실패로 끝나고 전환 단계는 실행되지 않는다.
      - name: 스모크 테스트 (태그 주소)
        env:
          TAG_URL: ${{ steps.deploy.outputs.url }}
        run: |
          case "$TAG_URL" in https://green---*) ;; *) echo "태그 주소가 아니다: $TAG_URL"; exit 1 ;; esac
          for i in $(seq 1 10); do
            HEALTH=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$TAG_URL/health" || true)
            VERSION=$(curl -s --max-time 5 "$TAG_URL/version" || true)
            COMMIT=$(echo "$VERSION" | jq -r '.commit // empty' 2>/dev/null || true)
            REVISION=$(echo "$VERSION" | jq -r '.revision // empty' 2>/dev/null || true)
            echo "$i번째 /health $HEALTH, commit $COMMIT, 리비전 $REVISION"
            if [ "$HEALTH" = "200" ] && [ "$COMMIT" = "$DEPLOY_COMMIT" ] && [ -n "$REVISION" ]; then
              echo "스모크 테스트 통과"
              echo "NEW_REVISION=$REVISION" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 6
          done
          echo "스모크 테스트 실패: 새 리비전은 0%로 두고 전환하지 않는다"
          exit 1

      # 스모크 테스트에 답한 바로 그 리비전으로 100% 옮긴다. 옮기기 전 리비전은 롤백할 곳으로 남긴다.
      - name: 전환 (새 리비전으로 100%)
        run: |
          PREV=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          echo "전환 전 리비전(롤백할 곳) $PREV"
          echo "전환할 리비전 $NEW_REVISION"
          gcloud run services update-traffic "${{ vars.SERVICE }}" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --to-revisions "$NEW_REVISION=100"
          echo "PREV_REVISION=$PREV" >> "$GITHUB_ENV"

      # 사람이 채우던 연결표 대신, 배포가 끝난 뒤 실제로 트래픽을 받는 리비전의 값을 실행 요약에 남긴다.
      - name: 배포 기록 남기기
        run: |
          REVISION=$(gcloud run services describe "${{ vars.SERVICE }}" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format json | jq -r '.status.traffic | max_by(.percent) | .revisionName')
          DIGEST=$(gcloud run revisions describe "$REVISION" --region us-central1 --project "${{ vars.GCP_PROJECT_ID }}" --format 'value(status.imageDigest)')
          {
            echo "### 배포 기록 (${{ vars.ENV }})"
            echo ""
            echo "| 서비스 | 커밋 | 리비전 | 이전 리비전(롤백할 곳) | 다이제스트 |"
            echo "| --- | --- | --- | --- | --- |"
            echo "| ${{ vars.SERVICE }} | \`$DEPLOY_COMMIT\` | \`$REVISION\` | \`$PREV_REVISION\` | \`${DIGEST#*@}\` |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
